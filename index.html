<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Little Universe</title>
    <style>
        :root {
            --bg-color: #0d0b18;
            --heart-pink: #ff4d6d;
            --pastel-purple: #c77dff;
            --glass-card: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 77, 109, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            min-height: 250vh; 
        }

        /* Ambient glowing universe backdrop */
        .cosmic-dust {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 77, 109, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(199, 125, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #15112a 0%, #0d0b18 100%);
            z-index: -3;
        }

        /* Mouse particle styling */
        .sparkle-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 1.2rem;
            user-select: none;
            animation: fallFade 1s forwards ease-out;
        }

        @keyframes fallFade {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) scale(0); opacity: 0; }
        }

        /* Scroll Progress Tracker Container */
        .main-canvas {
            width: 100%;
            position: relative;
        }

        .hero-view {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            text-align: center;
        }

        .pulsing-portal {
            font-size: 5rem;
            cursor: pointer;
            filter: drop-shadow(0 0 20px var(--heart-pink));
            animation: bouncePulse 3s infinite ease-in-out;
            user-select: none;
            transition: transform 0.2s;
        }

        .pulsing-portal:hover {
            transform: scale(1.2);
        }

        @keyframes bouncePulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        .hint-text {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ffb3c1;
            opacity: 0.6;
            animation: breath 2s infinite ease-in-out;
        }

        @keyframes breath {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* Dynamic Flower Field (Grows with Scroll) */
        .garden-tier {
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .digital-bouquet {
            display: flex;
            gap: 1.5rem;
            font-size: 2.5rem;
            perspective: 1000px;
        }

        .flower {
            transform: scale(0) rotate(-45deg);
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
            user-select: none;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }

        /* Interactive Playground Sandbox */
        .interactive-tier {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .love-engine-card {
            background: var(--glass-card);
            border: 1px solid var(--card-border);
            padding: 3rem 2rem;
            border-radius: 24px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            max-width: 460px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .love-engine-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 77, 109, 0.05), transparent);
            transform: rotate(45deg);
            animation: shineSweep 6s infinite linear;
            pointer-events: none;
        }

        @keyframes shineSweep {
            0% { transform: translate(-30%, -30%) rotate(45deg); }
            100% { transform: translate(30%, 30%) rotate(45deg); }
        }

        .love-engine-card h2 {
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            font-size: 1.6rem;
            color: #fff;
        }

        .input-slot {
            margin-bottom: 1.5rem;
        }

        input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.1rem;
            color: #fff;
            border-radius: 14px;
            width: 100%;
            text-align: center;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--heart-pink);
            background: rgba(255, 77, 109, 0.03);
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.2);
        }

        .action-btn {
            background: linear-gradient(135deg, var(--heart-pink), #ff758f);
            color: #fff;
            border: none;
            padding: 1.1rem;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 77, 109, 0.3);
            transition: all 0.3s;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.5);
        }

        .interactive-feedback {
            margin-top: 2rem;
            min-height: 70px;
            font-size: 1rem;
            line-height: 1.6;
            color: #ffe5ec;
        }

        /* Floating kiss animation modifier */
        .flying-kiss {
            position: fixed;
            pointer-events: none;
            font-size: 2.5rem;
            z-index: 10000;
            animation: kissLaunch 1.2s forwards cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        @keyframes kissLaunch {
            0% { transform: scale(0) rotate(0deg); bottom: 10%; left: 50%; opacity: 1; }
            50% { transform: scale(1.4) rotate(-15deg); }
            100% { transform: scale(1) rotate(15deg) translateY(-80vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Infinite space matrix layer -->
    <div class="cosmic-dust"></div>

    <div class="main-canvas">
        
        <!-- Tier 1: Interactive Entry Engine -->
        <div class="hero-view">
            <div class="pulsing-portal" id="portalCore" onclick="triggerBurst(event)">❤️</div>
            <div class="hint-text">Tap the heart to explode sparkles<br>↓ Then scroll down down down ↓</div>
        </div>

        <!-- Tier 2: The Scroll Garden (Asymmetric flower reveal) -->
        <div class="garden-tier">
            <div class="digital-bouquet" id="flowerBouquet">
                <div class="flower">🌸</div>
                <div class="flower">🌹</div>
                <div class="flower">🌷</div>
                <div class="flower">🌻</div>
                <div class="flower">🌹</div>
                <div class="flower">🌸</div>
            </div>
        </div>

        <!-- Tier 3: The Cryptographic Core -->
        <div class="interactive-tier">
            <div class="love-engine-card">
                <h2>Cosmic Singularity Engine</h2>
                
                <div class="input-slot">
                    <input type="text" id="nodeAlpha" placeholder="Enter Your Signature" autocomplete="off">
                </div>
                <div class="input-slot">
                    <input type="text" id="nodeBeta" placeholder="Enter Destination Target" autocomplete="off">
                </div>
                
                <button class="action-btn" onclick="executeCoreProtocol()">Sync Core Alignment</button>
                
                <div class="interactive-feedback" id="feedbackConsole"></div>
            </div>
        </div>

    </div>

    <script>
        // Magic Cursor Trail Feature
        const activeParticles = ['✨', '🌸', '💖', '⭐️', '🍬'];
        window.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.15) return; 

            const item = document.createElement('div');
            item.className = 'sparkle-particle';
            item.innerText = activeParticles[Math.floor(Math.random() * activeParticles.length)];
            item.style.left = e.clientX + 'px';
            item.style.top = e.clientY + 'px';
            
            const scatterX = (Math.random() - 0.5) * 120;
            const scatterY = (Math.random() - 0.5) * 120 - 50; 
            item.style.setProperty('--mx', `${scatterX}px`);
            item.style.setProperty('--my', `${scatterY}px`);

            document.body.appendChild(item);
            setTimeout(() => item.remove(), 1000);
        });

        // Click Event Explosion
        function triggerBurst(e) {
for (let i = 0; i < 12; i++) {
const splash = document.createElement('div');
splash.className = 'sparkle-particle';
splash.innerText = '💖';
splash.style.left = e.clientX + 'px';
splash.style.top = e.clientY + 'px';
const angle = (i / 12) * Math.PI * 2;
const distance = 80 + Math.random() * 60;
const scatterX = Math.cos(angle) * distance;
const scatterY = Math.sin(angle) * distance;
splash.style.setProperty('--mx', ${scatterX}px);
splash.style.setProperty('--my', ${scatterY}px);
document.body.appendChild(splash);
setTimeout(() => splash.remove(), 1000);
}
}
// Scroll Engine: Grows flowers and distorts elements based on positioning
window.addEventListener('scroll', () => {
const viewportHeight = window.innerHeight;
const currentScroll = window.scrollY;
const portal = document.getElementById('portalCore');
if (portal) {
portal.style.transform = scale(${1 + currentScroll * 0.0015}) rotate(${currentScroll * 0.2}deg);
portal.style.opacity = Math.max(0, 1 - currentScroll / 500);
}
const flowers = document.querySelectorAll('.flower');
const bouquetContainer = document.getElementById('flowerBouquet');
if (bouquetContainer) {
const containerTop = bouquetContainer.getBoundingClientRect().top;
if (containerTop < viewportHeight * 0.85) {
flowers.forEach((flower, index) => {
setTimeout(() => {
flower.style.transform = 'scale(1) rotate(0deg)';
flower.style.opacity = '1';
}, index * 100);
});
} else {
flowers.forEach((flower) => {
flower.style.transform = 'scale(0) rotate(-45deg)';
flower.style.opacity = '0';
});
}
}
});
// Cryptographic Algorithm Processing Sequence
function executeCoreProtocol() {
const alpha = document.getElementById('nodeAlpha').value.trim();
const beta = document.getElementById('nodeBeta').value.trim();
const consoleBox = document.getElementById('feedbackConsole');
if (!alpha || !beta) {
consoleBox.innerHTML = <span style="color: #ff758f;">⚠️ Secure handshake requires both connection profiles filled.</span>;
return;
}
let checksum = 0;
const combinedString = (alpha + beta).toLowerCase();
for (let i = 0; i < combinedString.length; i++) {
checksum += combinedString.charCodeAt(i);
}
const calculationRating = 94 + (checksum % 7);
const kiss = document.createElement('div');
kiss.className = 'flying-kiss';
kiss.innerText = '💋';
kiss.style.left = (window.innerWidth / 2 - 20) + 'px';
document.body.appendChild(kiss);
setTimeout(() => kiss.remove(), 1200);
consoleBox.innerHTML = <span style="font-size: 1.3rem; color: #ff4d6d; font-weight: bold; display: block; margin-bottom: 0.5rem; text-shadow: 0 0 10px rgba(255,77,109,0.4);"> 💖 Alignment Lock: ${calculationRating}% </span> <span style="font-size: 0.95rem; opacity: 0.9;"> Handshake complete! Sending a programmatic kiss up your interface window! 💋 </span>;
}
