<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Star-Weaver Interface</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1a0f1a 0%, #0a050d 100%);
            --rose-red: #ff3366;
            --gold-glow: #ffd700;
            --glass-card: rgba(255, 255, 255, 0.02);
            --border-line: rgba(255, 51, 102, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-gradient);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 220vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Continuous falling petal layer */
        #petalCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .scroll-container {
            position: relative;
            z-index: 2;
            width: 100%;
        }

        /* Screen 1: The Monogram Loom */
        .section-view {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
        }

        .interactive-orb {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at 30% 30%, #ff6699, #ff3366);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(255, 51, 102, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            user-select: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .interactive-orb:hover {
            transform: scale(1.15) rotate(15deg);
            box-shadow: 0 0 60px rgba(255, 51, 102, 0.9), 0 0 20px var(--gold-glow);
        }

        .intro-title {
            font-size: 2.2rem;
            font-weight: 300;
            margin-top: 2rem;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .scroll-down-hint {
            position: absolute;
            bottom: 4rem;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ff99bb;
            opacity: 0.5;
            animation: bounceTrack 2.5s infinite ease-in-out;
        }

        @keyframes bounceTrack {
            0%, 100% { transform: translateY(0); opacity: 0.3; }
            50% { transform: translateY(10px); opacity: 0.8; }
        }

        /* Screen 2: Dynamic Secret Code Engine */
        .card-panel {
            background: var(--glass-card);
            border: 1px solid var(--border-line);
            padding: 3.5rem 2.5rem;
            border-radius: 28px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
            max-width: 480px;
            width: 90%;
            text-align: center;
            position: relative;
        }

        .card-panel h2 {
            font-size: 1.7rem;
            font-weight: 400;
            margin-bottom: 2rem;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, #ff99bb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-row {
            position: relative;
            margin-bottom: 1.5rem;
        }

        input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.2rem;
            color: #fff;
            border-radius: 16px;
            width: 100%;
            text-align: center;
            font-size: 1.05rem;
            outline: none;
            transition: all 0.4s;
        }

        input:focus {
            border-color: var(--rose-red);
            background: rgba(255, 51, 102, 0.04);
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.25);
        }

        .trigger-btn {
            background: linear-gradient(135deg, #ff3366, #ff0055);
            color: #fff;
            border: none;
            padding: 1.2rem;
            width: 100%;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 51, 102, 0.3);
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .trigger-btn:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 15px 35px rgba(255, 51, 102, 0.5);
        }

        .decryption-terminal {
            margin-top: 2rem;
            min-height: 90px;
            font-size: 1rem;
            line-height: 1.6;
            color: #ffe6ec;
            background: rgba(0,0,0,0.2);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        /* Sparkle asset click track override */
        .click-spark {
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            font-size: 1.5rem;
            animation: spitGlow 0.8s forwards cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes spitGlow {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Canvas layer for smooth drifting petal background simulation -->
    <canvas id="petalCanvas"></canvas>

    <div class="scroll-container">
        
        <!-- Part 1: Interactive Key Anchor -->
        <div class="section-view">
            <div class="interactive-orb" id="masterOrb" onclick="burstSparks(event)">🌹</div>
            <h1 class="intro-title">The Quantum Monograph</h1>
            <div class="scroll-down-hint">↓ Scroll to unlock the weave blueprint ↓</div>
        </div>

        <!-- Part 2: Generative Cipher Card -->
        <div class="section-view">
            <div class="card-panel">
                <h2>Heartbeat Matrix Engine</h2>
                
                <div class="input-row">
                    <input type="text" id="userIn" placeholder="Your Name" autocomplete="off">
                </div>
                <div class="input-row">
                    <input type="text" id="targetIn" placeholder="Their Name" autocomplete="off">
                </div>
                
                <button class="trigger-btn" onclick="runDecryptionSequence()">Synthesize Resonance</button>
                
                <div class="decryption-terminal" id="terminalOutput">
                    <span style="opacity:0.4; font-style: italic;">Awaiting network handshake...</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- 1. Drifting Petals Canvas Physics Engine ---
        const canvas = document.getElementById('petalCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const petalPool = [];
        const petalTypes = ['🌸', '🌹', '💖', '✨'];

        class Petal {
            constructor() {
                this.reset();
                this.y = Math.random() * height; // Distribute initially across screen height
            }
            reset() {
                this.x = Math.random() * width;
                this.y = -20;
                this.size = Math.random() * 12 + 14;
                this.speedY = Math.random() * 1.5 + 1;
                this.speedX = (Math.random() - 0.5) * 1;
                this.char = petalTypes[Math.floor(Math.random() * petalTypes.length)];
                this.opacity = Math.random() * 0.4 + 0.3;
                this.rotation = Math.random() * 360;
                this.rotSpeed = (Math.random() - 0.5) * 2;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotSpeed;
                if (this.y > height + 20) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.font = `${this.size}px serif`;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillText(this.char, -this.size/2, this.size/2);
                ctx.restore();
            }
        }

        // Initialize 45 individual particle entities for elegant ambient depth
        for (let i = 0; i < 45; i++) {
            petalPool.push(new Petal());
        }

        function renderLoop() {
            ctx.clearRect(0, 0, width, height);
            for (let petal of petalPool) {
                petal.update();
                petal.draw();
            }
            requestAnimationFrame(renderLoop);
        }
        renderLoop();


        // --- 2. Screen Space Click Spark Engine ---
        function burstSparks(e) {
            const particleCount = 14;
            for (let i = 0; i < particleCount; i++) {
