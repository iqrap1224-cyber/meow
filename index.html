<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday My Love ✨</title>
  <style>
    :root {
      --primary: #ff4d6d;
      --secondary: #ff758f;
      --accent: #ffb3c1;
      --gold: #ffe5ec;
      --glass: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      background: linear-gradient(-45deg, #2b0938, #590d45, #800f4e, #2b0938);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #ffffff;
      overflow-x: hidden;
      min-height: 100vh;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating Canvas */
    #magic-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Music Floating Button */
    .music-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 100;
      background: rgba(255, 77, 109, 0.8);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50px;
      padding: 12px 24px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 20px rgba(255, 77, 109, 0.6);
      transition: all 0.3s ease;
    }

    .music-btn:hover {
      transform: scale(1.08);
      background: var(--primary);
      box-shadow: 0 0 30px rgba(255, 77, 109, 0.9);
    }

    /* Tap to Start Audio Overlay */
    #entry-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 5, 29, 0.95);
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(15px);
      transition: opacity 1s ease, visibility 1s;
    }

    #entry-overlay h1 {
      font-size: 2.8rem;
      background: linear-gradient(45deg, #ff758f, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
      animation: float 3s ease-in-out infinite;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 850px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    section {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
      margin-bottom: 60px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      border-radius: 30px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    h1, h2 {
      font-size: 2.6rem;
      margin-bottom: 20px;
      background: linear-gradient(45deg, var(--accent), #ffffff, var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #f1f1f1;
    }

    /* Counter Styling */
    .counter-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 25px;
      width: 100%;
    }

    .counter-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .counter-box span {
      display: block;
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--accent);
    }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      width: 100%;
      margin-top: 25px;
    }

    .gallery-card {
      height: 220px;
      border-radius: 20px;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .gallery-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 10px 25px rgba(255, 75, 114, 0.5);
    }

    /* Interactive Button */
    .magic-btn {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      border: none;
      padding: 16px 40px;
      border-radius: 50px;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 77, 109, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .magic-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 0 35px rgba(255, 77, 109, 0.9);
    }
  </style>
</head>
<body>

  <!-- Entry Overlay to allow Audio Playback -->
  <div id="entry-overlay" onclick="startMagic()">
    <h1>✨ Tap to Enter Our World ✨</h1>
    <p>Turn your sound on 🎵</p>
  </div>

  <!-- Background Music Element -->
  <!-- Replace audio URL below with your preferred direct MP3 link for "In the Middle of June" -->
  <audio id="bg-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <!-- Music Toggle Floating Button -->
  <button class="music-btn" onclick="toggleMusic()">
    <span id="music-icon">🎵</span> <span id="music-text">Playing</span>
  </button>

  <canvas id="magic-canvas"></canvas>

  <div class="container">

    <section>
      <h1>Happy Birthday, My Entire World ❤️</h1>
      <p>"In the middle of June, or any day of the year... loving you is the easiest thing I've ever done."</p>
    </section>

    <section>
      <h2>Time Spent Loving You ⏳</h2>
      <div class="counter-grid">
        <div class="counter-box"><span id="days">0</span>Days</div>
        <div class="counter-box"><span id="hours">0</span>Hours</div>
        <div class="counter-box"><span id="mins">0</span>Mins</div>
        <div class="counter-box"><span id="secs">0</span>Secs</div>
      </div>
    </section>

    <section>
      <h2>Our Magical Moments 📸</h2>
      <div class="gallery-grid">
        <div class="gallery-card" style="background-image: url('https://picsum.photos/400/400?random=10');"></div>
        <div class="gallery-card" style="background-image: url('https://picsum.photos/400/400?random=11');"></div>
        <div class="gallery-card" style="background-image: url('https://picsum.photos/400/400?random=12');"></div>
        <div class="gallery-card" style="background-image: url('https://picsum.photos/400/400?random=13');"></div>
      </div>
    </section>

    <section>
      <h2>A Wish For You 💫</h2>
      <button class="magic-btn" onclick="burstLove()">Shower My Love!</button>
    </section>

  </div>

  <script>
    /* Audio Handling */
    const music = document.getElementById('bg-music');
    let isPlaying = false;

    function startMagic() {
      document.getElementById('entry-overlay').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('entry-overlay').style.visibility = 'hidden';
      }, 1000);
      music.play();
      isPlaying = true;
    }

    function toggleMusic() {
      if (isPlaying) {
        music.pause();
        document.getElementById('music-icon').innerText = '🔇';
        document.getElementById('music-text').innerText = 'Paused';
      } else {
        music.play();
        document.getElementById('music-icon').innerText = '🎵';
        document.getElementById('music-text').innerText = 'Playing';
      }
      isPlaying = !isPlaying;
    }

    /* Animated Canvas (Hearts + Star Sparkles) */
    const canvas = document.getElementById('magic-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const items = [];
    class MagicParticle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 30;
        this.size = Math.random() * 16 + 8;
        this.speedY = Math.random() * 1.2 + 0.4;
        this.speedX = Math.sin(Math.random() * Math.PI) * 0.5;
        this.opacity = Math.random() * 0.6 + 0.3;
        this.symbol = Math.random() > 0.3 ? '💖' : '✨';
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -30) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.font = `${this.size}px serif`;
        ctx.fillText(this.symbol, this.x, this.y);
        ctx.restore();
      }
    }

    for (let i = 0; i < 40; i++) items.push(new MagicParticle());

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      items.forEach(item => { item.update(); item.draw(); });
      requestAnimationFrame(render);
    }
    render();

    /* Relationship Counter */
    const startDate = new Date('2022-06-15T00:00:00');
    function updateCounter() {
      const diff = new Date() - startDate;
      document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
      document.getElementById('hours').innerText = Math.floor((diff / (1000 * 60 * 60)) % 24);
      document.getElementById('mins').innerText = Math.floor((diff / 1000 / 60) % 60);
      document.getElementById('secs').innerText = Math.floor((diff / 1000) % 60);
    }
    setInterval(updateCounter, 1000);
    updateCounter();

    /* Love Burst Effect */
    function burstLove() {
      for (let i = 0; i < 50; i++) {
        const p = document.createElement('div');
        p.innerText = ['❤️', '💖', '✨', '🌸'][Math.floor(Math.random() * 4)];
        p.style.position = 'fixed';
        p.style.left = '50vw';
        p.style.top = '50vh';
        p.style.fontSize = `${Math.random() * 24 + 18}px`;
        p.style.pointerEvents = 'none';
        p.style.transition = 'all 1.8s cubic-bezier(0.1, 1, 0.1, 1)';
        p.style.zIndex = '9999';

        document.body.appendChild(p);

        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 350 + 100;

        setTimeout(() => {
          p.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(0)`;
          p.style.opacity = '0';
        }, 20);

        setTimeout(() => p.remove(), 1800);
      }
    }
  </script>
</body>
</html>
